name: bench

# Interleaved A/B on one runner: base (target branch) vs head (PR merge
# or dispatch ref), three reps-10 rounds each, same machine, same
# conditions — the deterministic-load measurement the local hardware
# cannot provide (ledger: mixed/cargo effects sit inside its ±4-6%
# scatter). Results land in the step summary; JSONs are attached.

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ab:
    name: A/B ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows runs the teptris-only A/B (competitor sources do
        # not all compile under MSVC; ratio tables stay linux/macos)
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout head (merge ref)
        uses: actions/checkout@v4
        with:
          path: head

      - name: Checkout base
        uses: actions/checkout@v4
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha || 'main' }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # reference libraries at the ledger pins, so ratio columns are
      # populated — PRs get the fast teptris-only A/B; pushes to main
      # (and dispatches) also fetch competitors for ONE full-matrix
      # sweep (fetch+build ~1 min, sweep ~7 min). The A/B rounds stay
      # teptris-only even here: competitors are identical pinned
      # sources in both trees, so measuring them per round per tree
      # re-measured constants 6x (that was the 38-44 min lane).
      - name: Fetch pinned reference libraries
        if: github.event_name != 'pull_request' && runner.os != 'Windows'
        run: |
          mkdir -p external
          git clone -q https://github.com/cktan/tomlc99.git external/tomlc99
          git -C external/tomlc99 checkout -q 29076df
          git clone -q --depth 1 -b v4.2.0 https://github.com/ToruNiina/toml11.git external/toml11
          git clone -q --depth 1 -b v3.4.0 https://github.com/marzer/tomlplusplus.git external/tomlplusplus
          git clone -q https://github.com/cktan/tomlc17.git external/tomlc17
          git -C external/tomlc17 checkout -q d7e91db
          git clone -q --depth 1 -b v0.1.1 https://github.com/skystrife/cpptoml.git external/cpptoml
          ls external

      - name: Build both trees
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # vswhere+vcvars+Ninja (the ci.yml recipe); inline cmd //c
            # strings get mangled by msys quoting - generate a .cmd
            VSWHERE="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
            VSPATH=$("$VSWHERE" -latest -products '*' -property installationPath)
            [ -n "$VSPATH" ] || { echo "vswhere found no VS install" >&2; exit 1; }
            VCVARS=$(cygpath -w "$VSPATH/VC/Auxiliary/Build/vcvarsall.bat" | sed 's/\\/\\\\/g')
            for d in base head; do
              cat > "_build_$d.cmd" <<CMDEOF
          @echo on
          call "$VCVARS" amd64 || exit /b 1
          cmake -B $d\build -S $d -G Ninja -DCMAKE_BUILD_TYPE=Release -DTEPTRIS_BUILD_BENCHMARKS=ON -DBUILD_TESTING=OFF || exit /b 1
          cmake --build $d\build || exit /b 1
          CMDEOF
              cmd //c "_build_$d.cmd"
              rc=$?
              rm -f "_build_$d.cmd"
              [ "$rc" -eq 0 ] || exit "$rc"
            done
          else
            for d in base head; do
              cmake -B "$d/build" -S "$d" -DCMAKE_BUILD_TYPE=Release \
                -DTEPTRIS_BUILD_BENCHMARKS=ON -DBUILD_TESTING=OFF \
                -DTEPTRIS_EXTERNAL_DIR="$PWD/external"
              cmake --build "$d/build" -j
            done
          fi

      - name: Generate corpus
        shell: bash
        run: python3 head/scripts/gen_bench_corpus.py corpus

      - name: Interleaved rounds (A B x3, parse + emit, teptris-only)
        shell: bash
        run: |
          EXE=""
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=".exe"; fi
          for r in 1 2 3; do
            ./base/build/benchmarks/bench_parse"$EXE" corpus 1 10 teptris > "a$r.json"
            ./head/build/benchmarks/bench_parse"$EXE" corpus 1 10 teptris > "b$r.json"
            ./base/build/benchmarks/bench_emit"$EXE" corpus 1 10 > "ae$r.json"
            ./head/build/benchmarks/bench_emit"$EXE" corpus 1 10 > "be$r.json"
          done

      # ratio columns: one full-matrix run from the head tree — the
      # competitors are the same pinned builds the rounds would use,
      # so this single sweep carries all their signal
      - name: Competitor sweep (one full-matrix run)
        if: github.event_name != 'pull_request' && runner.os != 'Windows'
        shell: bash
        run: ./head/build/benchmarks/bench_parse corpus 1 10 > comp.json

      - name: Report
        shell: bash
        run: |
          {
            echo "## bench A/B (${{ matrix.os }})"
            echo "### parse"
            echo '```'
            REF=()
            if [ -f comp.json ]; then REF=(--ref comp.json); fi
            python3 head/scripts/bench_ab.py "${REF[@]}" a1.json a2.json a3.json b1.json b2.json b3.json
            echo '```'
            echo "### emit"
            echo '```'
            python3 head/scripts/bench_ab.py ae1.json ae2.json ae3.json be1.json be2.json be3.json
            echo '```'
          } | tee report.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}-${{ github.run_id }}
          path: '*.json'

  # workflow-file linter: catches the duplicate-key / bad-schema class
  # that PyYAML tolerated and GitHub only surfaced as placeholder runs
  lint-workflows:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker://rhysd/actionlint:latest
        with:
          args: -color
