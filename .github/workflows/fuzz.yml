# Continuous fuzzing for the C99 parser: a libFuzzer harness round-
# trips parse -> emit -> re-parse under ASan/UBSan. The invariants
# are the memory-safety contracts (no crash, no leak), not semantic
# correctness (toml-test owns that). Nightly + manual dispatch;
# crashes fail the run and upload the offending inputs.
name: fuzz

on:
  schedule:
    - cron: "0 3 * * *"
    # weekly extended lane: 4 hours + the grown corpus published as a
    # public artifact (the fallback for OSS-Fuzz integration)
    - cron: "0 4 * * 6"
  workflow_dispatch:
    inputs:
      minutes:
        description: "fuzz budget in minutes"
        required: false
        default: "10"
      extended:
        description: "extended lane (long budget + corpus artifact)"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Build the harness (clang, fuzzer+address+undefined)
        run: |
          clang --version | head -1
          mkdir -p corpus crashes
          python3 scripts/gen_bench_corpus.py corpus
          clang -fsanitize=fuzzer,address,undefined -g -O1 -std=c99 \
            -Isrc/include -Isrc -o fuzz_parse \
            test/fuzz/fuzz_parse.c \
            src/teptris/*.c src/teptris/*/*.c src/teptris/*/*/*.c
          # plan-API harness (teptris#46 surface, the engine half of
          # both bindings' Descriptor): input parsed, a plan derived
          # deterministically from the same bytes, walked, every
          # accessor drained - plan build/walk/view lifetimes under
          # the same sanitizers
          clang -fsanitize=fuzzer,address,undefined -g -O1 -std=c99 \
            -Isrc/include -Isrc -o fuzz_plan \
            test/fuzz/fuzz_plan.c \
            src/teptris/*.c src/teptris/*/*.c src/teptris/*/*/*.c
          # builder/emitter harness (the bindings' dump path): input
          # bytes drive a builder op sequence, then every emitter view
          # (TOML, both JSONs) and flatten of the built document is
          # produced - builder stack, emitter escaping and buffer
          # growth under the same sanitizers
          clang -fsanitize=fuzzer,address,undefined -g -O1 -std=c99 \
            -Isrc/include -Isrc -o fuzz_dump \
            test/fuzz/fuzz_dump.c \
            src/teptris/*.c src/teptris/*/*.c src/teptris/*/*/*.c
          # batch-parse harness: N length-equal documents per input -
          # the batch API's zeroing/partial-failure contract, the
          # ERR_ALLOC nothing-to-free path and the shared-opts pointer
          clang -fsanitize=fuzzer,address,undefined -g -O1 -std=c99 \
            -Isrc/include -Isrc -o fuzz_parse_batch \
            test/fuzz/fuzz_parse_batch.c \
            src/teptris/*.c src/teptris/*/*.c src/teptris/*/*/*.c

      - name: Fuzz
        run: |
          MINS="${{ github.event.inputs.minutes || '10' }}"
          # the Saturday cron rides the extended lane (240 min)
          if [ "${{ github.event.schedule }}" = "0 4 * * 6" ] || [ "${{ github.event.inputs.extended }}" = "true" ]; then
            MINS=240
            echo "FUZZ_EXTENDED=1" >> "$GITHUB_ENV"
          fi
          SECS=$((MINS * 60))
          QUARTER=$((SECS / 4))
          ./fuzz_parse corpus -max_total_time="$QUARTER" -timeout=5 \
            -rss_limit_mb=2560 -artifact_prefix="$PWD/crashes/"
          ./fuzz_plan corpus -max_total_time="$QUARTER" -timeout=5 \
            -rss_limit_mb=2560 -artifact_prefix="$PWD/crashes/"
          ./fuzz_dump corpus -max_total_time="$QUARTER" -timeout=5 \
            -rss_limit_mb=2560 -artifact_prefix="$PWD/crashes/"
          ./fuzz_parse_batch corpus -max_total_time="$QUARTER" -timeout=5 \
            -rss_limit_mb=2560 -artifact_prefix="$PWD/crashes/"

      - name: Differential over the mutated corpus
        if: success()
        run: |
          cmake -B build-diff -S . -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DTEPTRIS_BUILD_CLI=ON \
            -DTEPTRIS_BUILD_SHARED=OFF
          cmake --build build-diff -j
          CLI=$(find build-diff -name teptris -type f | head -1)
          python3 scripts/differential.py "$CLI" corpus

      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes
          path: crashes/
          if-no-files-found: ignore

      - name: Publish the grown corpus (extended lane)
        if: env.FUZZ_EXTENDED == '1' && success()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus
          path: corpus/
          if-no-files-found: ignore
