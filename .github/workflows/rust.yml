name: Rust bindings

on:
  push:
    branches: [main]
    paths:
      - 'bindings/rust/**'
      - '.github/workflows/rust.yml'
      - 'src/**'
      - 'src/include/**'
  pull_request:
    paths:
      - 'bindings/rust/**'
      - '.github/workflows/rust.yml'
      - 'src/**'
      - 'src/include/**'
  workflow_dispatch:

concurrency:
  group: rust-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build libteptris shared library
        shell: bash
        run: |
          cmake -B build-shared -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DTEPTRIS_BUILD_SHARED=ON \
            -DTEPTRIS_BUILD_CLI=OFF \
            -DTEPTRIS_BUILD_STATIC=OFF
          cmake --build build-shared --config Release
          # MSVC multi-config generators drop the DLL in Release/;
          # point the resolver at the directory that actually has it
          if [ "$RUNNER_OS" = "Windows" ]; then
            DLL=$(find build-shared -name "teptris.dll" | head -1)
            echo "DLL resolved: ${DLL:-<none>}"
            [ -n "$DLL" ] || { echo "no teptris.dll produced"; find build-shared -type f | head -30; exit 1; }
            # stage NOW with msys paths (the later cygpath -w value is
            # native-windows and bash cp cannot read it - burned round:
            # the silent `|| true` hid the no-op copy)
            mkdir -p bindings/rust/target/debug/deps bindings/rust/target/debug
            cp "$DLL" bindings/rust/target/debug/deps/
            cp "$DLL" bindings/rust/target/debug/
            # ABSOLUTE + native for build.rs/Rust (backslashes)
            echo "TEPTRIS_LIB_PATH=$(cygpath -w "$(dirname "$DLL")")" >> "$GITHUB_ENV"
          else
            echo "TEPTRIS_LIB_PATH=$PWD/build-shared/src" >> "$GITHUB_ENV"
          fi

      - name: cargo build tests
        shell: bash
        working-directory: bindings/rust
        env:
          TEPTRIS_LIB_PATH: ${{ env.TEPTRIS_LIB_PATH }}
        run: |
          set -x
          echo "using lib at: $TEPTRIS_LIB_PATH"
          cargo test --no-run --verbose

      - name: cargo test
        if: runner.os != 'Windows'
        shell: bash
        working-directory: bindings/rust
        env:
          TEPTRIS_LIB_PATH: ${{ env.TEPTRIS_LIB_PATH }}
        run: cargo test --verbose

      # Windows: no rpath on PE - the DLL was staged beside the test
      # binaries during the lib build step
      - name: cargo test (Windows, DLL staged)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: bindings/rust
        env:
          TEPTRIS_LIB_PATH: ${{ env.TEPTRIS_LIB_PATH }}
        run: cargo test --verbose
