name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # MSVC never sees a unix CI otherwise; the v0.1.21 GNU attribute
  # breakage rode a tag until the python binding's ride PR caught it
  windows-msvc:
    name: windows-${{ matrix.arch }} (msvc)
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.arch }}
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DTEPTRIS_BUILD_CLI=ON
          cmake --build build
          cd build && ctest --output-on-failure

  build-test:
    # One cell per OS running BOTH builds sequentially (#201-class
    # wall fix): every job runs in ~1 min; a saturated runner pool
    # serializes 8 cells into a 38-min wall (measured) where the work
    # itself is 8 min. 8 slots -> 4, same coverage per OS.
    name: ${{ matrix.os }} (release + asan)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v7

      - name: Release build (warning check) + test
        run: |
          set -eux
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON -DTEPTRIS_BUILD_CLI=ON
          cmake --build build -j 2>&1 | tee /tmp/build.log
          if grep -iE "warning:" /tmp/build.log; then exit 1; fi
          ctest --test-dir build --output-on-failure

      - name: ASan build + test
        run: |
          set -eux
          FLAGS="-fsanitize=address -fno-omit-frame-pointer"
          cmake -B build-asan -S . -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON -DTEPTRIS_BUILD_CLI=ON \
            -DCMAKE_C_FLAGS="$FLAGS" -DCMAKE_CXX_FLAGS="$FLAGS"
          cmake --build build-asan -j
          ctest --test-dir build-asan --output-on-failure

  tsan:
    # The board's TSAN line: the preset is in-tree and green locally;
    # this lane keeps it honest on CI. Single-threaded suite (the
    # documented contract is one document per thread) — TSAN here
    # guards the batch/plan plumbing against accidental sharing.
    name: tsan (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTEPTRIS_ENABLE_TSAN=ON -DBUILD_TESTING=ON -DTEPTRIS_BUILD_CLI=OFF
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  entrypoint-coverage:
    name: entrypoint coverage (E3)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Every TEPTRIS_API symbol has fuzz + unit coverage
        run: bash scripts/entrypoint_coverage.sh
      # the fuzz lane runs on a schedule, hours after a merge — a
      # harness that stopped compiling against a changed API surfaced
      # there first (fuzz_plan.c vs the plan_idx accessor signature).
      # Compile-only: catches drift on every PR in ~30s.
      - name: The fuzz harnesses still compile
        run: |
          set -eux
          mkdir -p build-fuzz
          for h in parse parse_batch plan dump edit; do
            clang -fsanitize=fuzzer,address,undefined -g -O1 -std=c99 \
              -I src/include -I src -I test/fuzz \
              -c test/fuzz/fuzz_$h.c -o build-fuzz/fuzz_$h.o
          done

  differential:
    name: differential vs tomllib
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DTEPTRIS_BUILD_CLI=ON -DTEPTRIS_BUILD_SHARED=OFF
          cmake --build build -j
          CLI=$(find build -name teptris -type f | head -1)
          echo "TEPTRIS_CLI=$CLI" >> "$GITHUB_ENV"

      - name: Differential over toml-test valid + generated corpus
        run: |
          bash scripts/toml-test-run.sh corpus/toml-test
          python3 scripts/gen_bench_corpus.py bench-corpus
          python3 scripts/differential.py "$TEPTRIS_CLI" \
            corpus/toml-test/tests/valid bench-corpus test/differential-fixtures

  conformance:
    name: toml-test (1.1 view)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DTEPTRIS_BUILD_CLI=ON -DTEPTRIS_BUILD_SHARED=OFF
          cmake --build build -j

      - name: toml-test
        run: |
          mkdir -p build/cli
          # cmake puts the cli where the runner expects it
          find build -name teptris -type f -exec cp {} build/cli/ \; 2>/dev/null || true
          ls build/cli/
          TOML_VERSION=1.1 bash scripts/toml-test-run.sh
